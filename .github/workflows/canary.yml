name: Canary Validation

on:
  pull_request:
    paths:
      - "nest/**"
      - "harnest.yaml"

permissions:
  contents: read
  pull-requests: write

jobs:
  canary:
    name: Validate chicks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run canary
        uses: gioperalto/canary@main
