# harnest chick rubric
# ─────────────────────────────────────────────────────────────────────────────
# Each chick is scored 0–10 across five dimensions. Scores are integers.
# Use null when there is genuinely insufficient data to score a dimension.
#
# HOW TO INTERPRET EACH DIMENSION
# ────────────────────────────────
# functionality  — Does the chick do what it claims, end-to-end, reliably?
#   Scoring guide:
#     0–2  Broken or unrunnable. Core workflow fails in normal conditions.
#     3–4  Partially works. Major gaps, missing agents, or unrecoverable error paths.
#     5–6  Works for the happy path but breaks on edge cases or optional-tool absence.
#     7–8  Works reliably end-to-end. Optional tools degrade gracefully when absent.
#     9–10 Robust, well-tested, handles edge cases and failure modes explicitly.
#   Key questions: Does it hatch and run without errors? Does the output match
#   what the README promises? Do agents coordinate correctly per CLAUDE.md?
#   Does it recover or degrade gracefully when supplementary tools are absent?
#
# efficiency  — How cost-effective is the chick in terms of token consumption?
#   Scoring guide:
#     0–2  Extremely expensive. Uses opus everywhere or spawns many redundant agents.
#     3–4  High cost. Opus used where sonnet/haiku would suffice.
#     5–6  Moderate cost. Model choices are reasonable but not fully optimised.
#     7–8  Good cost discipline. Haiku for lightweight tasks, sonnet for implementation,
#          opus reserved for reasoning-heavy roles (interview, synthesis, architecture).
#     9–10 Minimal cost for the task. Uses the cheapest capable model at each step,
#          avoids redundant agent turns, keeps context windows tight.
#   Key questions: Are model choices (opus/sonnet/haiku) appropriate to each agent's
#   cognitive load? Are there unnecessary back-and-forth loops inflating turn counts?
#   Could any agent be replaced with a cheaper model without quality loss?
#
# documentation  — Does the README give users everything they need to hatch and run?
#   Scoring guide:
#     0–2  README missing or nearly empty.
#     3–4  Minimal README. Key setup steps are absent or buried.
#     5–6  README covers the basics but omits assumptions, edge cases, or env vars.
#     7–8  README covers all prerequisites, supplementary tools, limitations, and output.
#          Concise — no padded or redundant sections.
#     9–10 README is exemplary: clear workflow diagram, explicit fallback behaviour for
#          every optional tool, env var instructions, output format, and limitations.
#          Nothing is assumed that isn't stated.
#   Key questions: Does the README list every env var required? Are all
#   supplementary tools documented with fallback behaviour? Is the workflow
#   diagram accurate and easy to follow? Is it concise — free of filler?
#
# interoperability  — Does the chick compose cleanly with other chicks in a flock pipeline?
#   Scoring guide:
#     0–2  Cannot participate in a pipeline. Mutates global state, has no clean output,
#          or assumes a single-use environment that breaks when chained.
#     3–4  Can be used standalone but chaining it requires significant manual wiring.
#     5–6  Works in a pipeline with some effort. Input/output contract is implicit.
#     7–8  Produces a clear, documented output artifact (file path, format) that a
#          downstream chick can reliably consume. Minimal environmental side effects.
#     9–10 First-class pipeline citizen. Output format is explicit and stable. Leaves
#          the working directory in a predictable state. Tested as a pipeline step.
#   Key questions: What does this chick produce that the next chick in a pipeline
#   would consume? Is that output path/format documented? Does it leave the
#   working directory in a state that won't confuse a downstream chick?
#   Has it been validated inside an actual flock pipeline?
#
# usage  — Are real users running this chick and finding it valuable?
#   Scoring guide:
#     0–2  No known adoption. Experimental or not yet promoted.
#     3–4  Used occasionally by one or two internal users. Feedback limited.
#     5–6  Regular internal use. Some external interest or questions.
#     7–8  Actively used by multiple external users. Referenced in issues, PRs, or
#          community posts. Generates recurring questions suggesting real adoption.
#     9–10 Widely adopted. Appears in user-generated pipelines, showcases, or
#          third-party write-ups. Has measurable retention across sessions.
#   Key questions: Are people hatching this chick beyond initial experiments?
#   Are there GitHub issues or PRs touching this chick from external contributors?
#   Is it referenced in community discussions? Does usage grow over time?
#
# value  — Does the chick minimise prompt toil and deliver at or above user expectations?
#   Scoring guide:
#     0–2  Negative value. Output could be produced faster manually. High prompt toil
#          (many clarification loops, heavy setup) and output fails to meet expectations.
#     3–4  Marginal value. User saves some effort but still needs significant manual work
#          to reach a useful result. Output often falls short of what was implied.
#     5–6  Reasonable value. Chick delivers the promised output with moderate toil.
#          Users get roughly what they expected — neither delighted nor disappointed.
#     7–8  Clear value delivery. Chick minimises back-and-forth, handles assumptions
#          gracefully, and produces output that meets or slightly exceeds the stated goal.
#          Users feel the time saved relative to doing it themselves.
#     9–10 Exceptional value. Near-zero prompt toil. The chick anticipates needs, handles
#          edge cases without interruption, and delivers output that meaningfully exceeds
#          expectations. Users recommend it unprompted.
#   Key questions: How many times does the user need to intervene or re-prompt? Does the
#   output match what the README implies? Does the chick handle ambiguity without stalling?
#   Is the time saved clearly greater than the setup and invocation cost?
# ─────────────────────────────────────────────────────────────────────────────

features:

  flock:
    description: >
      Pipeline execution engine — validates flock.yaml, resolves chick dependencies,
      and orchestrates sequential or autonomous multi-chick runs with clean temp-file
      lifecycle management.
    scores:
      # harnest flock init should launch a claude session in addition to hatching, instead it prompts the user
      # this feature needs a lot of TLC to be considered usable and not just functional
      functionality: 1

      # Pure shell orchestration — no agent spawned for pipeline coordination itself.
      # Cost is entirely determined by the chicks it runs, not flock overhead.
      # The flock chick (init) is overkill (does it need multiple agents to create a yaml file?),
      # and does not begin the workflow — user is forced to enter unnecessary prompts.
      efficiency: 5

      # Docs cover subcommands, flags, and flock.yaml format with examples. However,
      # the critical gap is that "data flow between chicks" is handwaved — there is no
      # formal input/output contract specification. Users are left guessing how one
      # chick's output becomes the next chick's input beyond "shared working directory".
      documentation: 7

      # Core interoperability primitive, but overstated. Chicks share a working directory
      # and have depends_on ordering, but there are no typed contracts between steps.
      # If chick A produces X but chick B expects Y, nothing catches that mismatch.
      # No semantic validation of inter-chick compatibility — just execution order.
      interoperability: 8

      # Small open-source project. No evidence of external adoption. Central to the
      # harnest value proposition in theory, but adoption is bounded by the tiny user base.
      usage: null  # update with real data

      # Execution side delivers clear value — zero manual chaining once flock.yaml exists.
      # Init step undermines this: overkill agents, unnecessary prompt loops before work begins.
      value: 6

chicks:

  fullstack:
    description: >
      Structured software development team — architect plans, sr/jr engineers implement
      in parallel worktrees, test engineer validates before merge.
    scores:
      # Works on happy-path scoped tasks, but LLM "review" is not real review — it
      # reshuffles context and creates false confidence. Sr Engineer is a sequential
      # bottleneck reviewing all jr work. Worktrees solve file conflicts but not semantic
      # coordination. No error recovery if a worktree becomes corrupted. No explicit
      # escalation workflow when max_review_cycles is hit despite docs implying one.
      functionality: 5

      # 5 agents (opus architect + sonnet sr/test + 2x sonnet jr) is expensive. A skilled
      # developer with a single strong sonnet session would often move faster and cheaper
      # than managing five agents and fixing their misunderstandings. Opus for architecture
      # is defensible in theory but the coordination overhead negates the savings.
      efficiency: 4

      # README is thorough with workflow, config table, tool setup, and limitations.
      # CLAUDE.md is detailed. However, docs imply a level of reliability ("validates
      # before merge", "signs off") that the LLM review agents cannot actually deliver.
      # Slightly verbose — could be tighter.
      documentation: 7

      # Produces a git branch per task, which is clean. But worktree model means output
      # is on a branch that may have unresolved semantic issues from weak LLM review.
      # No formal output contract for downstream chicks to rely on.
      interoperability: 5

      # Small open-source project. Flagship chick but no evidence of external adoption
      # beyond initial experiments. Likely tried by a handful of early users.
      usage: null  # update with real data

      # The promise is ambitious — replace a multi-day dev workflow with a single hatch.
      # Reality: a skilled developer will often move faster solo than managing five agents.
      # Output quality is unpredictable. Token cost is high and not always proportionate.
      # Marginal value for complex tasks; moderate value for simple, scoped work.
      value: 4

  webpage:
    description: >
      Single-page React Vite TypeScript website builder — strategist interviews the user,
      artist generates images, builder constructs the site, UX tester signs off.
    scores:
      # One of the more defensible chicks — narrow deliverable, visible output. But "UX
      # tester signs off" is mostly theater unless Playwright is configured and running;
      # otherwise it devolves into static code vibes. No coordination mechanism for how
      # builder watches for artist's assets — README says "integrates images when available"
      # but the handoff is aspirational, not implemented. Nano Banana credentials are
      # complicated (Vertex AI SA or Gemini key) and fallback to CSS gradients degrades
      # the experience significantly.
      functionality: 6

      # Opus strategist for an interview step is expensive and unjustified — sonnet can
      # conduct a brief user interview. No worktrees keeps overhead low, but the overall
      # cost is still higher than it needs to be for a single-page site.
      efficiency: 5

      # README covers env vars, auth methods, fallbacks, and output format well. Among the
      # most thorough READMEs. However, the docs imply builder/artist coordination that
      # doesn't have a real mechanism behind it. Slightly aspirational.
      documentation: 8

      # Output is a standard React Vite project — easy for downstream consumption. But
      # no branch artifact and no formal output contract. Pipeline must consume the
      # working directory directly, which is fragile for chaining.
      interoperability: 5

      # Produces a tangible, deployable artifact which is appealing for demos. But small
      # project with no evidence of sustained external adoption.
      usage: null  # update with real data

      # Decent value for simple marketing pages. The gap between user effort and output is
      # real but not as large as claimed — a skilled dev with a Vite template and an image
      # generator can match this in similar time. Value drops sharply if Nano Banana is
      # unavailable (CSS gradient fallback is not a "live-ready product").
      value: 6

  brainstorm:
    description: >
      Creative ideation team — facilitator frames the challenge, explorer and provocateur
      generate ideas in parallel (provocateur routes to Gemini via CCR), synthesizer
      produces a prioritised output document.
    scores:
      # Core workflow is sound. Ideation tolerates LLM slop better than coding, so the
      # multi-agent approach is less risky here. But without CCR, the "provocateur falls
      # back to Claude haiku" which is a much weaker model — the dual-angle creative
      # diversity that justifies the architecture largely evaporates. CLAUDE.md downplays
      # this: "fully functional either way" is misleading when haiku != Gemini quality.
      functionality: 6

      # Opus facilitator + two idea generators + synthesizer is expensive for something a
      # single well-crafted prompt session can often produce almost as well. The CCR/Gemini
      # cost offload helps, but the setup toil and external dependency undermine the ROI.
      efficiency: 3

      # README covers CCR install, Gemini API key, config JSON, and fallback behaviour.
      # Prerequisites section is complex. Fallback quality degradation is downplayed —
      # docs should be more honest about haiku vs. Gemini creative output gap.
      documentation: 7

      # brainstorm-output.md is a clear artifact, but it's human-readable prose, not a
      # stable machine contract. A downstream chick consuming it must parse freeform
      # text with no guaranteed structure. Interop is implicit at best.
      interoperability: 4

      # Niche use case with a high barrier (CCR + Gemini API key). No evidence of
      # adoption beyond the author. Experimental.
      usage: null  # update with real data

      # CCR setup and Gemini API key are real upfront toil. Once past that, the output is a
      # prioritised idea document — useful but not immediately actionable. Value is real for
      # power users; barrier too high for casual ones.
      value: 5

  canary:
    description: >
      QA and dogfooding chick — validator runs structural checkpoints against target chicks,
      observer monitors OTel telemetry in parallel, both contribute to a pass/fail report.
    scores:
      # The most overclaimed chick in spirit. "Dogfood other chicks" implies actually running
      # them, but chicks are never hatched or executed — only structural linting happens.
      # 6 checkpoints (file presence, YAML schema, frontmatter, CLAUDE.md structure, naming,
      # cross-references) are purely structural. They cannot tell you whether a chick actually
      # produces good outcomes. OTel observer is useless without Jaeger/Datadog setup, and
      # "Telemetry unavailable" fallback defeats the purpose of having the observer at all.
      # "Anomaly detection" is vague — no defined thresholds or criteria.
      functionality: 4

      # Two agents with lean model choices — this is genuinely the right call. Haiku for
      # observer is appropriate. But the observer is often doing nothing (telemetry unavailable),
      # making it wasted cost in the common case.
      efficiency: 6

      # README and CLAUDE.md are detailed with Docker commands and env vars. Report format
      # is well-described. The documentation is honest about what it does, even if the
      # description ("dogfood other chicks") oversells the structural-only validation.
      documentation: 8

      # Internal QA tooling. Not designed for pipelines. Produces a report file but it's
      # not a stable contract for downstream consumption. Chaining is impractical.
      interoperability: 3

      # Internal use only. No external users. Adoption is limited to the single maintainer's
      # release cadence. Experimental at best.
      usage: null  # update with real data

      # Structural linting is something a shell script with find + grep could do in seconds.
      # Using two LLM agents for file-presence checks and YAML validation is overkill.
      # The pass/fail report adds marginal value over manual inspection. OTel monitoring
      # is genuinely useful when configured, but rarely is.
      value: 3

  chick:
    description: >
      Meta chick creator — parallel researchers map the domain, synthesizer interviews the
      user and writes a design brief, builder scaffolds the chick, reviewer signs off on
      convention compliance.
    scores:
      # Meta-generation is where LLMs compound their own mistakes. Two haiku researchers
      # feeding opus synthesizer feeding sonnet builder feeding sonnet reviewer is elaborate
      # ceremony for generating prompt scaffolding. The "convention checklist" reviewer
      # references is never actually specified — it's implicit knowledge, not a codified
      # gate. Builder "studies reference chicks" but which patterns to adopt is undefined.
      # Can probably create convention-shaped folders, but output needs heavy human
      # intervention to produce genuinely strong workflows.
      functionality: 4

      # Haiku for researchers is cheap, but opus for synthesis is expensive for what is
      # essentially "interview the user and write a brief". Four agents total for
      # scaffolding a directory with 3-4 files is overengineered. A single sonnet session
      # with a good template would accomplish the same.
      efficiency: 4

      # README is comprehensive with roles, workflow diagram, config, and supplementary
      # tools. But it references a "convention checklist" that doesn't exist in the docs.
      # "Builder studies reference chicks" without specifying which patterns to learn is
      # a gap. Documentation is detailed but partly aspirational.
      documentation: 7

      # Meta tooling — produces a new chick directory, not a consumable artifact for
      # downstream chicks. Intended to be run standalone before a chick enters a pipeline.
      interoperability: 3

      # Used whenever a new chick is created, which is rarely. Adoption bounded by the
      # project's slow growth rate. No external contributors creating chicks.
      usage: null  # update with real data

      # The scaffolding task is real but modest — creating 3-4 convention-compliant files
      # is not that tedious for someone who knows the conventions. The four-agent ceremony
      # adds overhead that often exceeds the manual effort. Output is a skeleton that still
      # needs substantial human refinement to become a genuinely useful chick.
      value: 3

  flock:
    description: >
      Meta pipeline creator — interviewer discovers available chicks and interviews the user,
      composer generates a valid flock.yaml ready for execution.
    scores:
      # Produces syntactically valid flock.yaml with dependency and circular-dependency
      # checks. But overstates understanding of data flow — most chicks don't expose
      # formal input/output contracts, so the "pipeline design" is just ordering, not
      # semantic wiring. Interviewer "asks about per-chick prompts" without automated
      # discovery of what prompts each chick expects. README example references chicks
      # like "researcher" and "architect" that don't appear to be real shipped chicks,
      # which undermines trust in the output.
      functionality: 5

      # Opus interviewer for generating a YAML config file is unjustified. This is not
      # a reasoning-heavy task — sonnet can conduct a brief interview and write YAML.
      # Two agents for a task that a single session could handle is overengineered.
      efficiency: 3

      # README explains flock.yaml format with an example, but the example references
      # non-existent chicks. Workflow steps and limitations are covered but the critical
      # gap — how data actually flows between chicks — is handwaved. Not as focused
      # or accurate as it appears at first glance.
      documentation: 6

      # Helps users build pipelines but is itself standalone. The generated flock.yaml
      # has no semantic validation — it won't catch mismatches between chick outputs
      # and inputs. Useful starting point but not a reliable pipeline design tool.
      interoperability: 4

      # Utility chick used when designing new pipelines, which is rarely. No evidence
      # of external usage. The chick catalogue is too small to drive frequent use.
      usage: null  # update with real data

      # Writing flock.yaml by hand is simple for anyone who reads the docs — it's just
      # a list of chick names with depends_on fields. The opus interview adds cost and
      # ceremony that exceeds the manual effort for most pipelines. Moderate value only
      # for users unfamiliar with the format.
      value: 4

  webgame:
    description: >
      Web game builder — game designer interviews the user and selects a tech stack,
      builder implements the full playable game with GitHub Actions deployment,
      playtester reviews for bugs and GDD conformance.
    scores:
      # Harder than webpage but pitched with similar confidence. "Implements the full
      # playable game" is a big promise for a single sonnet builder — games have complex
      # state management, physics, input handling, and rendering that LLMs struggle with.
      # Playtester is a weak review agent unless Playwright is actually wired up with
      # real browser testing; otherwise it's static code vibes checking against a GDD.
      # "GDD conformance" is vague — no operationalized acceptance criteria.
      # For trivial games this may help; for anything beyond that, manual dev is safer.
      functionality: 4

      # Opus for game designer is expensive for an interview + tech stack selection step
      # that sonnet could handle. Three agents total is moderate but the cost is not
      # justified by the output quality for non-trivial games.
      efficiency: 4

      # README covers tech stacks, deployment, Playwright, and output structure clearly.
      # Tech stack table is useful. But "full playable game" and "GDD conformance" lack
      # operationalized definitions. What counts as complete? What format is playtester
      # feedback? These gaps matter when the output disappoints.
      documentation: 7

      # Self-contained game directory is a natural terminal step. But output is not easily
      # consumed by further chicks — it's an end product, not a pipeline artifact.
      # No formal output contract.
      interoperability: 4

      # Demo-friendly but niche. No evidence of external adoption. Game creation is a
      # fun demo category but not a recurring need for most users.
      usage: null  # update with real data

      # For trivial games (clicker, snake), the interview-to-game pipeline delivers real
      # value. But the promise of "a result that would normally take days" is inflated —
      # a skilled dev with a game template can match trivial game output faster and with
      # more control. For non-trivial games, the LLM builder will produce buggy output
      # that requires significant manual fixing, eroding the time savings entirely.
      value: 4

  improver:
    description: >
      Self-improvement engine — assessor randomly selects a rubric item, new feature,
      or tech debt target; implementer makes the change on a patch/ branch; validator
      reviews critically and adjusts score deltas; shipper updates rubric.yaml and
      submits a PR.
    scores:
      # The least convincing chick. Randomly selecting improvement categories, letting
      # LLMs change the repo, then having other LLMs "validate" and open PRs is exactly
      # how you generate plausible-but-middling churn. Random category selection gives
      # equal probability to "improve documentation" vs "fix critical bug" — no weighting
      # by impact. One revision cycle can mask issues: if validator reduces scope too much,
      # implementer ships half-finished work. No post-PR validation — the PR might fail CI.
      # No serious maintainer would trust unreviewed LLM-generated PRs to their repo.
      functionality: 3

      # Four agents (opus assessor + 3x sonnet) for generating a single PR is expensive.
      # High token cost, high repo risk, weak real QA. The opus assessor reads the entire
      # codebase to pick a random improvement target — expensive for what could be a
      # simple weighted random selection from a prioritized backlog.
      efficiency: 2

      # README covers prerequisites, workflow, output, categories, and limitations well.
      # CLAUDE.md is detailed. Version bump and rubric cap rules are explicit. The docs
      # are honest about what it does, which is the strongest aspect of this chick.
      documentation: 7

      # Meta tooling producing PRs — not a pipeline artifact. Cannot be chained.
      # Mutates the repo directly, which is a liability in any pipeline context.
      interoperability: 2

      # Internal use only by the project maintainer. No external users would run this
      # against their own repos. Purely experimental.
      usage: null  # update with real data

      # The fundamental question: does letting LLMs randomly improve your repo actually
      # save time? The answer is almost always no. A maintainer reviewing the PR still
      # needs to understand every change, test it, and often fix it — effort that exceeds
      # just making the improvement manually with intent. Random category selection means
      # the improvement is often not the most impactful thing to work on. High token cost
      # for low-confidence output. Negative value for serious projects.
      value: 2
